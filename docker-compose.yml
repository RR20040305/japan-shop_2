services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/app/data
    networks:
      - app-net

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    networks:
      - app-net

  backend1:
    build: .
    environment:
      - SERVER_ID=1
      - DB_HOST=postgres
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - ACCESS_EXPIRES_IN=${ACCESS_EXPIRES_IN}
      - REFRESH_EXPIRES_IN=${REFRESH_EXPIRES_IN}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - NODE_ENV=production
      - RABBITMQ_URL=amqp://rabbitmq
    depends_on:
      - postgres
      - mongo
      - rabbitmq
    volumes:
      - ./data:/app/data
    networks:
      - app-net

  backend2:
    build: .
    environment:
      - SERVER_ID=2
      - DB_HOST=postgres
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - ACCESS_EXPIRES_IN=${ACCESS_EXPIRES_IN}
      - REFRESH_EXPIRES_IN=${REFRESH_EXPIRES_IN}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - NODE_ENV=production
      - RABBITMQ_URL=amqp://rabbitmq
    depends_on:
      - postgres
      - mongo
      - rabbitmq
    volumes:
      - ./data:/app/data
    networks:
      - app-net

  backend3:
    build: .
    environment:
      - SERVER_ID=3
      - DB_HOST=postgres
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - ACCESS_EXPIRES_IN=${ACCESS_EXPIRES_IN}
      - REFRESH_EXPIRES_IN=${REFRESH_EXPIRES_IN}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - NODE_ENV=production
      - RABBITMQ_URL=amqp://rabbitmq
    depends_on:
      - postgres
      - mongo
      - rabbitmq
    volumes:
      - ./data:/app/data
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - app-net

  haproxy:
    image: haproxy:alpine
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:80"
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - app-net

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-net

  worker1:
    build: .
    command: ["node", "worker.js"]
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - SERVER_ID=worker1
    depends_on:
      - rabbitmq
      - postgres
    networks:
      - app-net

  worker2:
    build: .
    command: ["node", "worker.js"]
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - SERVER_ID=worker2
    depends_on:
      - rabbitmq
      - postgres
    networks:
      - app-net

networks:
  app-net:

volumes:
  pgdata:
  mongo_data: