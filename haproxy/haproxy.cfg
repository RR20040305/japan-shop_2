global
    maxconn 100

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend http-in
    bind *:80
    default_backend backends

backend backends
    balance roundrobin
    server backend1 backend1:3000 check
    server backend2 backend2:3000 check
    server backend3 backend3:3000 check
