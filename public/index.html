<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4285f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DriftShop">
  <title>Токийский дрифт – магазин</title>
  <link rel="stylesheet" href="https://unpkg.com/chota@latest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Токийский дрифт</h1>
    <nav>
      <button id="home-btn" class="button">Главная</button>
      <button id="about-btn" class="button">О нас</button>
      <button id="react-btn" class="button">React-версия</button>
      <button id="users-btn" class="button" style="display:none;">Пользователи</button>
      <button id="logout-btn" class="button error" style="display:none;">Выйти</button>
    </nav>
    <!-- Кнопки управления уведомлениями -->
    <div id="push-controls" style="display:none; margin-top: 0.5rem;">
      <button id="reminders-btn" class="button">Напоминания</button>
      <button id="enable-push-btn" class="button">Включить уведомления</button>
      <button id="disable-push-btn" class="button" style="display:none;">Отключить уведомления</button>
    </div>
  </header>

  <main class="products-area" id="app">
    <!-- Контент загружается динамически -->
  </main>

  <div id="auth-container" style="margin-top: 2rem;">
    <div id="login-form" class="card">
      <h3>Вход</h3>
      <input type="email" id="login-email" placeholder="Email" class="input">
      <input type="password" id="login-password" placeholder="Пароль" class="input">
      <button id="login-btn" class="button primary">Войти</button>
      <button id="show-register-btn" class="button">Регистрация</button>
      <div id="login-error" class="error"></div>
    </div>
    <div id="register-form" class="card hidden">
      <h3>Регистрация</h3>
      <input type="email" id="reg-email" placeholder="Email" class="input">
      <input type="text" id="reg-firstname" placeholder="Имя" class="input">
      <input type="text" id="reg-lastname" placeholder="Фамилия" class="input">
      <input type="password" id="reg-password" placeholder="Пароль (мин. 6 символов)" class="input">
      <button id="register-btn" class="button primary">Зарегистрироваться</button>
      <button id="show-login-btn" class="button">Назад к входу</button>
      <div id="register-error" class="error"></div>
    </div>
  </div>

  <footer class="site-footer">
    2026
  </footer>

  <!-- Подключаем Socket.IO клиент (сервер раздаёт /socket.io/socket.io.js) -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>

  <!-- Регистрация Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker зарегистрирован:', reg.scope))
          .catch(err => console.error('Ошибка регистрации SW:', err));
      });
    }
  </script>
</body>
</html>
